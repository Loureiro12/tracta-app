# Cold start, then sign in as the seeded demo account through the E2E-only route, which also
# restores the demo data (public.e2e_reset_demo). Every flow therefore starts on Home, signed in,
# with identical data and the locale pinned to English.
appId: com.tracta.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true
# A system alert left behind by a previous flow would hide the app: clear it before waiting.
- runFlow: ./dismiss-system-dialogs.yaml
- extendedWaitUntil:
    visible:
      id: "auth.screen"
    timeout: 60000
- openLink: "tracta://e2e-sign-in?locale=en"
- runFlow: ./accept-deep-link-prompt.yaml
# The preparing screen is visible only while sign-in + reset run (~1 s), so it is optional.
- extendedWaitUntil:
    visible:
      id: "auth.e2e.screen"
    timeout: 3000
    optional: true
- extendedWaitUntil:
    visible:
      id: "home.screen"
    timeout: 20000
