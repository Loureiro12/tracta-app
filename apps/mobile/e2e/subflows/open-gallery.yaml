# Deep-links straight into a design-system gallery. Usage:
#   - runFlow:
#       file: ../../subflows/open-gallery.yaml
#       env:
#         SLUG: button
appId: com.tracta.mobile
---
- launchApp:
    clearState: true
- openLink: "tracta://design-system/${SLUG}"
- assertVisible:
    id: "ds.gallery.screen.${SLUG}"
