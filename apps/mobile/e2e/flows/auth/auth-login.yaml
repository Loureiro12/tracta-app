appId: com.tracta.mobile
name: auth-login
tags:
  - auth
---
- runFlow: ../../subflows/launch-signed-out.yaml
# Cross links between sign in and sign up, and the back buttons
- tapOn:
    id: "auth.welcome.login"
- tapOn:
    id: "auth.login.signup"
- assertVisible:
    id: "auth.signup.screen"
- tapOn:
    id: "auth.signup.login"
- assertVisible:
    id: "auth.login.screen"
- tapOn:
    id: "auth.login.back"
- assertVisible:
    id: "auth.screen"
- tapOn:
    id: "auth.welcome.signup"
- assertVisible:
    id: "auth.signup.screen"
- tapOn:
    id: "auth.signup.back"
- assertVisible:
    id: "auth.screen"
# Sign in screen
- tapOn:
    id: "auth.welcome.login"
- assertVisible:
    id: "auth.login.screen"
- assertVisible:
    id: "auth.login.title"
    text: "Sign in"
- assertVisible:
    id: "auth.login.email"
- assertVisible:
    id: "auth.login.password"
# Empty submit → inline errors (validated on the device)
- tapOn:
    id: "auth.login.submit"
- assertVisible:
    id: "auth.login.email.error"
    text: "Enter a valid email"
- assertVisible:
    id: "auth.login.password.error"
    text: "Enter your password"
# Wrong password → the server rejects it → general error
- tapOn:
    id: "auth.login.email.input"
- inputText: "lucas@tracta.app"
- runFlow: ../../subflows/dismiss-system-dialogs.yaml
- tapOn:
    id: "auth.login.password.input"
- inputText: "wrong-password"
- runFlow: ../../subflows/dismiss-system-dialogs.yaml
- tapOn:
    id: "auth.login.title"
- tapOn:
    id: "auth.login.toggle-password"
- assertVisible:
    id: "auth.login.toggle-password.label"
    text: "Hide"
- tapOn:
    id: "auth.login.submit"
- extendedWaitUntil:
    visible:
      id: "auth.login.error"
    timeout: 10000
# Demo account password → signed in → Home
- tapOn:
    id: "auth.login.password.input"
- eraseText: 20
- inputText: "Tracta2026"
- runFlow: ../../subflows/dismiss-system-dialogs.yaml
- tapOn:
    id: "auth.login.title"
- tapOn:
    id: "auth.login.submit"
- extendedWaitUntil:
    visible:
      id: "home.screen"
    timeout: 15000
- assertVisible:
    id: "app.toast"
    text: "Welcome back"
