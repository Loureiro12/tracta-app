appId: com.tracta.mobile
name: auth-social
tags:
  - auth
---
# Apple/Google sign-in need OAuth credentials in Supabase; until then the buttons say so.
- runFlow: ../../subflows/launch-signed-out.yaml
- tapOn:
    id: "auth.welcome.signup"
- assertVisible:
    id: "auth.signup.screen"
- scrollUntilVisible:
    element:
      id: "auth.signup.apple"
    centerElement: true
- tapOn:
    id: "auth.signup.apple"
- assertVisible:
    id: "app.toast"
    text: "Apple sign-in is coming soon"
- tapOn:
    id: "auth.signup.google"
- assertVisible:
    id: "app.toast"
    text: "Google sign-in is coming soon"
- tapOn:
    id: "auth.signup.back"
- tapOn:
    id: "auth.welcome.login"
- scrollUntilVisible:
    element:
      id: "auth.login.apple"
    centerElement: true
- tapOn:
    id: "auth.login.apple"
- assertVisible:
    id: "app.toast"
    text: "Apple sign-in is coming soon"
- scrollUntilVisible:
    element:
      id: "auth.login.google"
    centerElement: true
- tapOn:
    id: "auth.login.google"
- assertVisible:
    id: "app.toast"
    text: "Google sign-in is coming soon"
- assertVisible:
    id: "auth.login.screen"
