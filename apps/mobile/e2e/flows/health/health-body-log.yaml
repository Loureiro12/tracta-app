appId: com.tracta.mobile
name: health-body-log
tags:
  - health
---
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: "app.tab.health"
- assertVisible:
    id: "health.screen"
- tapOn:
    id: "health.segment.body"
- assertVisible:
    id: "health.body.hero"
- assertVisible:
    id: "health.body.weight"
    text: "78.1 kg"
- assertVisible:
    id: "health.body.chart"
- scrollUntilVisible:
    element:
      id: "health.body.measures"
    centerElement: true
- assertVisible:
    id: "health.body.measures.waist"
- scrollUntilVisible:
    element:
      id: "health.body.register"
    centerElement: true
- tapOn:
    id: "health.body.register"
- assertVisible:
    id: "health.body-log.sheet"
- assertVisible:
    id: "health.body-log.sheet.title"
    text: "Log · today"
- assertVisible:
    id: "health.body-log.waist"
- assertVisible:
    id: "health.body-log.hip"
- assertVisible:
    id: "health.body-log.arm"
- assertVisible:
    id: "health.body-log.weight"
- tapOn:
    id: "health.body-log.arm.plus"
- assertVisible:
    id: "health.body-log.arm.field.input"
    text: "36"
- tapOn:
    id: "health.body-log.weight.field.input"
- eraseText: 10
- inputText: "80.5"
- runFlow: ../../subflows/dismiss-system-dialogs.yaml
# Numeric keypad has no dismiss key: tapping the plain field label inside the scroll view closes it
- tapOn:
    id: "health.body-log.weight.label"
- runFlow: ../../subflows/dismiss-system-dialogs.yaml
- tapOn:
    id: "health.body-log.save"
- assertVisible:
    id: "app.toast"
    text: "Entry saved"
- assertVisible:
    id: "health.body.weight"
    text: "80.5 kg"
- assertVisible:
    id: "health.body.measures.waist.description"
    text: "manual · today"
