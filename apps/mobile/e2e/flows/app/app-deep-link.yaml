appId: com.tracta.mobile
name: app-deep-link
tags:
  - app
---
- runFlow: ../../subflows/launch.yaml
- openLink: "tracta://settings?locale=en"
- runFlow: ../../subflows/accept-deep-link-prompt.yaml
- assertVisible:
    id: "settings.screen"
- openLink: "tracta://design-system"
- runFlow: ../../subflows/accept-deep-link-prompt.yaml
- assertVisible:
    id: "ds.index.screen"
- assertVisible:
    id: "ds.index.title"
    text: "Design system"
- tapOn:
    id: "ds.index.link.button"
- assertVisible:
    id: "ds.gallery.screen.button"
# Unknown gallery slug renders the not-found state instead of crashing.
- openLink: "tracta://design-system/does-not-exist"
- runFlow: ../../subflows/accept-deep-link-prompt.yaml
- assertVisible:
    id: "ds.gallery.not-found"
