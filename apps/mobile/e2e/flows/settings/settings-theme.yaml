appId: com.tracta.mobile
name: settings-theme
tags:
  - smoke
  - settings
---
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: "home.nav.settings"
- assertVisible:
    id: "settings.theme.current"
    text: "Theme: System"
- tapOn:
    id: "settings.theme.dark"
- assertVisible:
    id: "settings.theme.current"
    text: "Theme: Dark"
- tapOn:
    id: "settings.theme.light"
- assertVisible:
    id: "settings.theme.current"
    text: "Theme: Light"
- tapOn:
    id: "settings.theme.system"
- assertVisible:
    id: "settings.theme.current"
    text: "Theme: System"
- tapOn:
    id: "settings.nav.back"
- assertVisible:
    id: "home.screen"
