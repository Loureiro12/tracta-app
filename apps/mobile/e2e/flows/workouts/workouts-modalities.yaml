appId: com.tracta.mobile
name: workouts-modalities
tags:
  - workouts
---
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: "app.tab.workouts"
- tapOn:
    id: "workouts.start.others"
- assertVisible:
    id: "workouts.modalities.screen"
- assertVisible:
    id: "workouts.modalities.screen.title"
    text: "Other modalities"
- assertVisible:
    id: "workouts.modalities.list"
- assertVisible:
    id: "workouts.modalities.list.bike.label"
    text: "Cycling"
- assertVisible:
    id: "workouts.modalities.list.swim.label"
    text: "Swimming"
- tapOn:
    id: "workouts.modalities.list.bike"
- assertVisible:
    id: "run.screen"
