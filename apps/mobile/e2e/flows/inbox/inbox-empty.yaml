appId: com.tracta.mobile
name: inbox-empty
tags:
  - inbox
---
# Seeded inbox (supabase/seeds/40_social.sql): …b000-000000000001..6 = n1..n6, newest first.
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: "home.nav.inbox"
- assertVisible:
    id: "inbox.screen"
- assertNotVisible:
    id: "inbox.empty"
- tapOn:
    id: "inbox.items.00000000-0000-4000-b000-000000000001.remove"
- tapOn:
    id: "inbox.items.00000000-0000-4000-b000-000000000002.remove"
- tapOn:
    id: "inbox.items.00000000-0000-4000-b000-000000000003.remove"
- assertNotVisible:
    id: "inbox.items.today.label"
- assertVisible:
    id: "inbox.items.week.label"
    text: "This week"
- tapOn:
    id: "inbox.items.00000000-0000-4000-b000-000000000004.remove"
- tapOn:
    id: "inbox.items.00000000-0000-4000-b000-000000000005.remove"
- tapOn:
    id: "inbox.items.00000000-0000-4000-b000-000000000006.remove"
- assertVisible:
    id: "inbox.empty"
- assertVisible:
    id: "inbox.empty.title"
    text: "All caught up"
- assertNotVisible:
    id: "inbox.items.week.label"
- assertNotVisible:
    id: "inbox.read-all"
