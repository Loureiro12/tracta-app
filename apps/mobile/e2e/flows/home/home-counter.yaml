appId: com.tracta.mobile
name: home-counter
tags:
  - smoke
  - home
---
- runFlow: ../../subflows/launch.yaml
- assertVisible:
    id: "home.counter.value"
    text: "0 taps"
- tapOn:
    id: "home.counter.increment"
- assertVisible:
    id: "home.counter.value"
    text: "1 tap"
- tapOn:
    id: "home.counter.increment"
- assertVisible:
    id: "home.counter.value"
    text: "2 taps"
- tapOn:
    id: "home.counter.reset"
- assertVisible:
    id: "home.counter.value"
    text: "0 taps"
