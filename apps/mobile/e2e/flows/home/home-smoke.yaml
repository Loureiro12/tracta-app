appId: com.tracta.mobile
name: home-smoke
tags:
  - smoke
  - home
---
- runFlow: ../../subflows/launch.yaml
# Sticky header: date eyebrow, 30px title and the three round actions
- assertVisible:
    id: "home.title"
    text: "How am I today"
- assertVisible:
    id: "home.eyebrow"
- assertVisible:
    id: "home.nav.edit"
- assertVisible:
    id: "home.nav.inbox"
- assertVisible:
    id: "home.nav.inbox.badge"
- assertVisible:
    id: "home.nav.profile"
# Apple Health sync line (the E2E build syncs its fake Health store on launch, so the time is
# either the seeded 16:12 or the moment of that sync) and the dark weekly teaser
- assertVisible:
    id: "home.sync.line"
    text: "Apple Health · synced at [0-9]{2}:[0-9]{2}"
- assertVisible:
    id: "home.weekly.card"
- assertVisible:
    id: "home.weekly.headline"
    text: "A consistent week"
- assertVisible:
    id: "home.weekly.card.view"
# Sleep card
- assertVisible:
    id: "home.sleep.card"
- assertVisible:
    id: "home.sleep.value"
    text: "6h 50"
- assertVisible:
    id: "home.sleep.score"
    text: "85"
# Movement card (summary density: no mini bars)
- scrollUntilVisible:
    element:
      id: "home.move.card"
    centerElement: true
- assertVisible:
    id: "home.move.value"
    text: "6,842"
# Goals come from the account (Perfil › Metas)
- assertVisible:
    id: "home.move.goal"
    text: "of 10,000 steps"
- assertVisible:
    id: "home.move.stats"
- assertNotVisible:
    id: "home.move.bars"
- assertNotVisible:
    id: "home.sleep.bars"
# Two-column stats
- scrollUntilVisible:
    element:
      id: "home.hr.card"
    centerElement: true
- assertVisible:
    id: "home.hr.value"
    text: "58"
- assertVisible:
    id: "home.week.card"
- assertVisible:
    id: "home.week.value"
    text: "0"
- assertVisible:
    id: "home.week.goal"
    text: "of 4"
# Planned workout
- scrollUntilVisible:
    element:
      id: "home.next.card"
    centerElement: true
- assertVisible:
    id: "home.next.title"
    text: "Treino A"
- assertVisible:
    id: "home.next.start.label"
    text: "Start workout"
- assertNotVisible:
    id: "home.next.done"
# Friends and last activity
- scrollUntilVisible:
    element:
      id: "home.friends.card"
    centerElement: true
# The demo account takes part in the seeded challenge, so the card shows its top 3
- assertVisible:
    id: "home.friends.title"
    text: "Semana em movimento"
- assertVisible:
    id: "home.friends.ranking"
- assertNotVisible:
    id: "home.friends.cta"
- scrollUntilVisible:
    element:
      id: "home.last.card"
    centerElement: true
# Latest seeded entry: Saturday's 8.2 km run
- assertVisible:
    id: "home.last.details"
    text: "8.2 km · 45:41 · 5:34 /km"
- assertVisible:
    id: "home.last.history.label"
    text: "History"
# Dev-only shortcuts at the end of the scroll
- scrollUntilVisible:
    element:
      id: "home.nav.settings"
    centerElement: true
- assertVisible:
    id: "home.nav.settings.label"
    text: "Settings"
- assertVisible:
    id: "home.nav.design-system.label"
    text: "Design system"
