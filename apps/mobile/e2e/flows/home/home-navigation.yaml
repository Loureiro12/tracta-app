appId: com.tracta.mobile
name: home-navigation
tags:
  - home
---
- runFlow: ../../subflows/launch.yaml
# Sleep and movement cards open the Health tab
- tapOn:
    id: "home.sleep.card"
- assertVisible:
    id: "health.screen"
- tapOn:
    id: "app.tab.home"
- assertVisible:
    id: "home.screen"
- scrollUntilVisible:
    element:
      id: "home.move.card"
    centerElement: true
- tapOn:
    id: "home.move.card"
- assertVisible:
    id: "health.screen"
- tapOn:
    id: "app.tab.home"
# Avatar opens the Profile tab
- tapOn:
    id: "home.nav.profile"
- assertVisible:
    id: "profile.screen"
- tapOn:
    id: "app.tab.home"
# "History" shortcut on the last-activity card
- scrollUntilVisible:
    element:
      id: "home.last.history"
    centerElement: true
- tapOn:
    id: "home.last.history"
- assertVisible:
    id: "history.screen"
- tapOn:
    id: "app.tab.home"
# Friends card opens the social hub (overlay with its own back button)
- scrollUntilVisible:
    element:
      id: "home.friends.card"
    centerElement: true
- tapOn:
    id: "home.friends.card"
- assertVisible:
    id: "social.screen"
- tapOn:
    id: "social.hub.back"
- assertVisible:
    id: "home.screen"
# "Iniciar treino" starts the planned session
- scrollUntilVisible:
    element:
      id: "home.next.start"
    centerElement: true
- tapOn:
    id: "home.next.start"
- assertVisible:
    id: "session.screen"
