appId: com.tracta.mobile
name: social-challenge-train
tags:
  - social
---
# Challenge c1 "Semana em movimento" is seeded with id …c000-000000000001 (supabase/seeds/40_social.sql).
- runFlow: ../../subflows/launch.yaml
- openLink: "tracta://social?locale=en"
- runFlow: ../../subflows/accept-deep-link-prompt.yaml
- tapOn:
    id: "social.hub.challenges.00000000-0000-4000-c000-000000000001"
- assertVisible:
    id: "social.challenge.screen"
- tapOn:
    id: "social.challenge.back"
- assertVisible:
    id: "social.screen"
- tapOn:
    id: "social.hub.challenges.00000000-0000-4000-c000-000000000001"
- scrollUntilVisible:
    element:
      id: "social.challenge.train"
    centerElement: true
- tapOn:
    id: "social.challenge.train"
- extendedWaitUntil:
    visible:
      id: "workouts.screen"
    timeout: 10000
