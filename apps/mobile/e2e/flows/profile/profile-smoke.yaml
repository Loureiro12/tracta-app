appId: com.tracta.mobile
name: profile-smoke
tags:
  - smoke
  - profile
---
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: "app.tab.profile"
- assertVisible:
    id: "profile.screen"
- assertVisible:
    id: "profile.header.name"
    text: "Lucas Andrade"
- assertVisible:
    id: "profile.header.email"
    text: "lucas@tracta.app · backup on"
- assertVisible:
    id: "profile.header.edit"
- assertVisible:
    id: "profile.goals-list"
- assertVisible:
    id: "profile.goals-list.steps.value"
    text: "10,000"
- assertVisible:
    id: "profile.goals-list.sleep.value"
    text: "7h 30"
- assertVisible:
    id: "profile.goals-list.workouts.value"
    text: "4"
- assertVisible:
    id: "profile.goals-list.runKm.value"
    text: "15 km"
- scrollUntilVisible:
    element:
      id: "profile.sources.card"
    direction: DOWN
    centerElement: true
- assertVisible:
    id: "profile.sources.card"
- scrollUntilVisible:
    element:
      id: "profile.nav.connections"
    direction: DOWN
    centerElement: true
- assertVisible:
    id: "profile.nav.achievements.label"
    text: "Achievements"
- assertVisible:
    id: "profile.nav.photos.label"
    text: "Progress photos"
- assertVisible:
    id: "profile.nav.social.label"
    text: "Friends & challenges"
- assertVisible:
    id: "profile.nav.tour.label"
    text: "See the app tour"
- assertVisible:
    id: "profile.nav.connections.label"
    text: "Manage connections"
- scrollUntilVisible:
    element:
      id: "profile.prefs.visibility"
    direction: DOWN
    centerElement: true
- assertVisible:
    id: "profile.prefs.units"
- assertVisible:
    id: "profile.prefs.units.value"
    text: "kg · km"
# Units and auto rest toggle on tap (saved to the account)
- tapOn:
    id: "profile.prefs.units"
- assertVisible:
    id: "profile.prefs.units.value"
    text: "lb · km"
- tapOn:
    id: "profile.prefs.units"
- assertVisible:
    id: "profile.prefs.units.value"
    text: "kg · km"
- assertVisible:
    id: "profile.prefs.auto-rest"
- assertVisible:
    id: "profile.prefs.auto-rest.value"
    text: "On"
- tapOn:
    id: "profile.prefs.auto-rest"
- assertVisible:
    id: "profile.prefs.auto-rest.value"
    text: "Off"
- tapOn:
    id: "profile.prefs.auto-rest"
- assertVisible:
    id: "profile.prefs.auto-rest.value"
    text: "On"
- assertVisible:
    id: "profile.prefs.notifications.value"
    text: "5 on"
# "Who sees my workouts" cycles Friends → Only me → Everyone → Friends
- assertVisible:
    id: "profile.prefs.visibility.value"
    text: "Friends"
- tapOn:
    id: "profile.prefs.visibility"
- assertVisible:
    id: "app.toast.message"
    text: "Visible to: Only me"
- assertVisible:
    id: "profile.prefs.visibility.value"
    text: "Only me"
- tapOn:
    id: "profile.prefs.visibility"
- assertVisible:
    id: "profile.prefs.visibility.value"
    text: "Everyone"
- tapOn:
    id: "profile.prefs.visibility"
- assertVisible:
    id: "profile.prefs.visibility.value"
    text: "Friends"
- scrollUntilVisible:
    element:
      id: "profile.logout"
    direction: DOWN
    centerElement: true
# "App preferences" opens the existing theme/language screen
- tapOn:
    id: "profile.prefs.app-settings"
- assertVisible:
    id: "settings.screen"
- tapOn:
    id: "settings.nav.back"
- assertVisible:
    id: "profile.screen"
- scrollUntilVisible:
    element:
      id: "profile.logout"
    direction: DOWN
    centerElement: true
- assertVisible:
    id: "profile.logout.label"
    text: "Log out"
- tapOn:
    id: "profile.logout"
- assertVisible:
    id: "app.toast.message"
    text: "You signed out"
- assertVisible:
    id: "auth.screen"
