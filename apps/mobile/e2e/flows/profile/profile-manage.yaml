appId: com.tracta.mobile
name: profile-manage
tags:
  - profile
---
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: "app.tab.profile"
- tapOn:
    id: "profile.pro.cta"
- assertVisible:
    id: "profile.paywall.screen"
- tapOn:
    id: "profile.paywall.buy"
- assertVisible:
    id: "app.toast.message"
    text: "Free trial activated"
- assertVisible:
    id: "profile.pro.cta.label"
    text: "Manage"
- assertVisible:
    id: "profile.pro.description"
    text: "Free trial until Nov 3 · then R$ 119.90/year"
- tapOn:
    id: "profile.pro.cta"
- assertVisible:
    id: "profile.manage.screen"
- tapOn:
    id: "profile.manage.back"
- assertVisible:
    id: "profile.screen"
- tapOn:
    id: "profile.pro.cta"
- assertVisible:
    id: "profile.manage.rows"
- assertVisible:
    id: "profile.manage.rows.plan.value"
    text: "Yearly · R$ 119.90"
- assertVisible:
    id: "profile.manage.rows.status.value"
    text: "Free trial"
- assertVisible:
    id: "profile.manage.rows.date.label"
    text: "First charge"
- assertVisible:
    id: "profile.manage.rows.date.value"
    text: "Nov 3, 2026"
- assertVisible:
    id: "profile.manage.rows.payment.value"
    text: "Apple ID"
- assertVisible:
    id: "profile.manage.switch.label"
    text: "Switch to monthly"
- tapOn:
    id: "profile.manage.switch"
- assertVisible:
    id: "app.toast.message"
    text: "Plan changes at the next renewal"
- assertVisible:
    id: "profile.manage.rows.plan.value"
    text: "Monthly · R$ 14.90"
- assertVisible:
    id: "profile.manage.switch.label"
    text: "Switch to yearly"
# Cancel needs a second tap
- assertVisible:
    id: "profile.manage.cancel.label"
    text: "Cancel subscription"
- tapOn:
    id: "profile.manage.cancel"
- assertVisible:
    id: "profile.manage.cancel.label"
    text: "Tap again to cancel"
- tapOn:
    id: "profile.manage.cancel"
- assertVisible:
    id: "app.toast.message"
    text: "Subscription cancelled"
- assertVisible:
    id: "profile.manage.rows.status.value"
    text: "Cancelled"
- assertVisible:
    id: "profile.manage.rows.date.label"
    text: "Access until"
- assertVisible:
    id: "profile.manage.rows.date.value"
    text: "Nov 27, 2026"
- assertVisible:
    id: "profile.manage.cancel.label"
    text: "Reactivate subscription"
- tapOn:
    id: "profile.manage.cancel"
- assertVisible:
    id: "app.toast.message"
    text: "Subscription reactivated"
- assertVisible:
    id: "profile.manage.rows.status.value"
    text: "Free trial"
- tapOn:
    id: "profile.manage.back"
- assertVisible:
    id: "profile.pro.description"
    text: "Free trial until Nov 3 · then R$ 14.90/month"
