appId: com.tracta.mobile
name: history-recap
tags:
  - history
---
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: "app.tab.history"
- assertVisible:
    id: "history.screen"
- tapOn:
    id: "history.recap.open"
- assertVisible:
    id: "history.recap.screen"
- assertVisible:
    id: "history.recap.progress"
- assertVisible:
    id: "history.recap.kicker"
    text: "In October you trained"
- assertVisible:
    id: "history.recap.big"
    text: "14"
- assertVisible:
    id: "history.recap.title"
    text: "times — same as in September."
# Tap advances, "Previous" goes back, the fifth tap closes the recap.
- tapOn:
    id: "history.recap.next"
- assertVisible:
    id: "history.recap.kicker"
    text: "You ran"
- assertVisible:
    id: "history.recap.big"
    text: "38.4 km"
- tapOn:
    id: "history.recap.next"
- assertVisible:
    id: "history.recap.kicker"
    text: "You lifted"
- assertVisible:
    id: "history.recap.big"
    text: "58.9 t"
- tapOn:
    id: "history.recap.prev"
- assertVisible:
    id: "history.recap.kicker"
    text: "You ran"
- tapOn:
    id: "history.recap.next"
- tapOn:
    id: "history.recap.next"
- assertVisible:
    id: "history.recap.kicker"
    text: "New records"
- assertVisible:
    id: "history.recap.big"
    text: "11"
- tapOn:
    id: "history.recap.next"
- assertVisible:
    id: "history.recap.kicker"
    text: "And you rested"
- assertVisible:
    id: "history.recap.big"
    text: "7h 05"
# October nights so far against the four synced September nights (seeds/50_health.sql)
- assertVisible: ".*9 min less\\."
- tapOn:
    id: "history.recap.next"
- assertVisible:
    id: "history.screen"
# "Fechar" closes from any slide.
- tapOn:
    id: "history.recap.open"
- assertVisible:
    id: "history.recap.screen"
- tapOn:
    id: "history.recap.close"
- assertVisible:
    id: "history.screen"
# "Compartilhar" opens the share overlay with the month template.
- tapOn:
    id: "history.recap.open"
- tapOn:
    id: "history.recap.share"
- assertVisible:
    id: "share.screen"
